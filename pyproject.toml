[project]
name = "downscaling-climate-projections"
version = "0.1.0"
description = ""
authors = [
    {name = "Zachary-Stone",email = "zstone100@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "xarray (>=2026.7.0,<2027.0.0)",
    "netcdf4 (>=1.7.4,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "codecarbon (>=3.3.1,<4.0.0)",
    "cartopy (>=0.25.0,<0.26.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)"
]

[tool.poetry]
package-mode = true
packages = [
    { include = "*", from = "src" }
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
